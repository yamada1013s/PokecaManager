name: Discover official Japanese card IDs

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages to fetch (1 = schema test; 0 = all pages)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP dependency
        run: python -m pip install requests

      - name: Discover official card IDs
        run: |
          python tools/card_master/discover_official_jp_card_ids.py \
            --max-pages "${{ inputs.max_pages }}" \
            --delay 2 \
            --output-dir build/official-jp-discovery

      - name: Upload discovery data
        uses: actions/upload-artifact@v4
        with:
          name: official-jp-card-discovery
          path: build/official-jp-discovery/
          if-no-files-found: error
          retention-days: 14
